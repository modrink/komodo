name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: sccache

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-build
          cache-on-failure: true

      - name: Build
        run: cargo build

      - name: Run tests
        run: cargo test

      - name: sccache stats
        if: always()
        run: sccache --show-stats

  fmt:
    name: Format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check
